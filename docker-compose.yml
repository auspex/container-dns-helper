services:
  dns-helper:
    build: .
    # image: container-dns-helper:1.0.0
    cap_add:
      - NET_ADMIN
      - NET_RAW
    container_name: dns-helper
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/dbus:/var/run/dbus
    network_mode: host
